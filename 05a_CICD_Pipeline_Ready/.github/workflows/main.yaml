name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Trigger Backend Cloud Build
      run: |
        gcloud builds submit backend/ --config backend/cloudbuild.yaml --substitutions=_FRONTEND_URL=${{ secrets.FRONTEND_URL }},_GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},_GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Trigger Frontend Cloud Build
      run: |
        gcloud builds submit frontend/ --config frontend/cloudbuild.yaml --substitutions=_BACKEND_URL=${{ secrets.BACKEND_URL }}